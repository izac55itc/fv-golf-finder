name: Scrape Tee Times

on:
  schedule:
    - cron: '0 * * * *'   # every hour at :00
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Chromium (first run or cache miss)
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        run: node index.js

      - name: Publish to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save output before any branch switch
          cp scraper/teetimes.json /tmp/teetimes.json

          # Switch to data branch (create orphan if first run)
          git fetch origin data 2>/dev/null \
            && git checkout -B data origin/data \
            || { git checkout --orphan data && git rm -rf . --quiet 2>/dev/null; true; }

          cp /tmp/teetimes.json teetimes.json
          git add teetimes.json

          # Only commit if something changed
          git diff --cached --quiet \
            || git commit -m "scrape: $(date -u '+%Y-%m-%d %H:%M UTC')"

          git push origin data
